<!doctype html><html lang="id"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Beauté. Cloud Control</title><style>*{box-sizing:border-box}body{margin:0;background:#101522;color:#f7f3ff;font:16px system-ui;padding:20px}.wrap{max-width:800px;margin:auto}header{display:flex;align-items:center;gap:15px;margin:24px 0}.logo{background:#b795f2;color:#101522;border-radius:15px;padding:15px;font-size:24px;font-weight:900}h1{margin:0;font-size:26px}small{color:#a9b1c4}.card{background:#202638;padding:22px;border-radius:18px;margin:16px 0}button,input{font:inherit;border-radius:10px;padding:12px;border:0}input{width:100%;background:#121827;color:white;margin:12px 0}button{background:#b795f2;color:#141021;font-weight:700;margin:4px;cursor:pointer}button.stop{background:#e9a0a8}pre{background:#0b1020;color:#b5e7c6;border-radius:10px;padding:14px;max-height:420px;overflow:auto;white-space:pre-wrap;overflow-wrap:anywhere;font-size:12px}.stats{display:flex;gap:20px;flex-wrap:wrap}.stats span{background:#121827;padding:12px;border-radius:10px}</style></head><body><main class="wrap"><header><div class="logo">B.</div><div><h1>Beauté. Cloud Control</h1><small>Development · GitHub + Railway</small></div></header><section class="card"><label for="token">Admin token</label><input id="token" type="password" placeholder="Masukkan PANEL_TOKEN" autocomplete="off"><button onclick="login()">Hubungkan panel</button><p><small>Token hanya disimpan di memori tab ini.</small></p></section><section class="card"><h2 id="status">Belum terhubung</h2><div class="stats"><span id="pid">PID —</span><span id="uptime">Uptime —</span><span id="restarts">Restart —</span></div><p><button onclick="action('start')">▶ Start</button><button onclick="action('restart')">↻ Restart</button><button class="stop" onclick="action('stop')">■ Stop</button></p></section><section class="card"><h3>Live console (refresh 3 detik)</h3><pre id="logs">Menunggu koneksi...</pre></section></main><script>let secret='';const el=id=>document.getElementById(id);function login(){secret=el('token').value;el('token').value='';refresh()}async function api(route,method='GET'){const r=await fetch(route,{method,headers:{Authorization:'Bearer '+secret}});if(!r.ok)throw Error('HTTP '+r.status);return r.json()}async function refresh(){if(!secret)return;try{const d=await api('/api/status');el('status').textContent=d.running?'🟢 Proses bot berjalan':'⚪ Bot berhenti';el('pid').textContent='PID '+(d.pid||'—');el('uptime').textContent='Uptime '+Math.floor(d.uptime/60)+' menit';el('restarts').textContent='Restart '+d.restarts;el('logs').textContent=d.logs.join('\n')}catch(e){el('status').textContent='Akses gagal: '+e.message}}async function action(x){if(!secret)return alert('Masukkan token dahulu');try{await api('/api/'+x,'POST');setTimeout(refresh,500)}catch(e){alert(e.message)}}setInterval(refresh,3000)</script></body></html>
