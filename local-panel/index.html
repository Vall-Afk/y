<!doctype html><html lang="id"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Beauté. Cloud Local</title><style>*{box-sizing:border-box}body{margin:0;padding:24px;background:#101522;color:#f5f2fc;font:16px system-ui}.wrap{max-width:800px;margin:auto}header{display:flex;align-items:center;gap:14px;margin:15px 0 30px}.logo{padding:16px;border-radius:16px;background:#b795f2;color:#151023;font-size:26px;font-weight:900}h1{margin:0}.muted{color:#a9b1c4;font-size:13px}.card{background:#202638;padding:22px;border-radius:18px;margin:16px 0}input,button{font:inherit;padding:12px;border:0;border-radius:10px}input{width:100%;background:#101522;color:white;margin:12px 0}button{background:#b795f2;color:#181026;font-weight:700;cursor:pointer;margin:4px}.stop{background:#eda4ad}.stats{display:flex;flex-wrap:wrap;gap:10px}.stats span{background:#101522;padding:12px;border-radius:10px}pre{background:#0c1120;padding:15px;border-radius:10px;max-height:450px;overflow:auto;white-space:pre-wrap;overflow-wrap:anywhere;color:#b6e6c6;font-size:12px}</style></head><body><main class="wrap"><header><div class="logo">B.</div><div><h1>Beauté. Cloud</h1><div class="muted">Windows 11 · Local Development Hosting</div></div></header><section class="card"><label>Admin token dari jendela terminal</label><input id="token" type="password" placeholder="Tempel token admin"><button onclick="login()">Masuk</button><p class="muted">Token hanya tersimpan selama tab ini terbuka.</p></section><section class="card"><h2 id="state">Belum terhubung</h2><div class="stats"><span id="pid">PID —</span><span id="up">Uptime —</span><span id="restarts">Restart —</span></div><p><button onclick="action('start')">▶ Start</button><button onclick="action('restart')">↻ Restart</button><button class="stop" onclick="action('stop')">■ Stop</button></p></section><section class="card"><h3>Console</h3><pre id="logs">Masuk untuk melihat log...</pre></section></main><script>let key='';const el=x=>document.getElementById(x);function login(){key=el('token').value;el('token').value='';refresh()}async function call(p,m='GET'){const r=await fetch(p,{method:m,headers:{Authorization:'Bearer '+key}});if(!r.ok)throw Error('HTTP '+r.status);return r.json()}async function refresh(){if(!key)return;try{const d=await call('/api/status');el('state').textContent=d.running?'🟢 Proses bot aktif':'⚪ Proses bot berhenti';el('pid').textContent='PID '+(d.pid||'—');el('up').textContent='Uptime '+Math.floor(d.uptime/60)+' menit';el('restarts').textContent='Restart '+d.restarts;el('logs').textContent=d.logs.join('\n')}catch(e){el('state').textContent='Gagal terhubung: '+e.message}}async function action(x){if(!key)return alert('Login dahulu');try{await call('/api/'+x,'POST');setTimeout(refresh,500)}catch(e){alert(e.message)}}setInterval(refresh,3000)</script></body></html>
